<style id="ca-at-style">
#ca-at {
  --navy: #1d3c5c; --navy-deep: #13293f; --cardinal: #b93c35; --gold: #C0780A; --ivory: #F8F1E9; --paper: #FFFCF7;
  --mint: #A5E9D9; --gray: #5E6670;
  --bg: var(--ivory); --fg: var(--navy); --muted: var(--gray); --card: var(--paper); --line: rgba(29,60,92,.16); --line-strong: rgba(29,60,92,.35);
  --accent: var(--gold); --done: var(--navy); --done-fg: #fff; --todo: #C9CED4; --todo-icon: #8A939D; --ring: var(--gold); --partial-bg: #F7E9D2;
  --chip-on: var(--navy); --chip-on-fg: #fff; --radius: 14px; --stripe: rgba(29,60,92,.05); --glow: rgba(192,120,10,.28);
  --ca-top: 0px;
  container-type: inline-size;
  background: var(--bg); color: var(--fg); font-family: inherit; font-size: 16px; line-height: 1.45;
  border-radius: var(--radius); padding: 16px 16px 14px; margin: 8px 0 28px; text-align: left;
}
#ca-at[data-look="b"] { --bg: #fff; --card: #fff; --accent: var(--cardinal); --todo: #E3E7EB; --ring: var(--navy); --radius: 0px; padding: 16px 16px 8px; border-top: 3px solid var(--navy); }
#ca-at[data-look="c"] { --bg: var(--navy); --fg: var(--ivory); --muted: rgba(248,241,233,.82); --card: rgba(255,255,255,.07); --line: rgba(248,241,233,.16); --line-strong: rgba(248,241,233,.4);
  --accent: #EA9E83; --done: var(--mint); --done-fg: var(--navy-deep); --todo: rgba(248,241,233,.28); --todo-icon: rgba(248,241,233,.55); --ring: var(--mint);
  --partial-bg: rgba(165,233,217,.22); --chip-on: var(--ivory); --chip-on-fg: var(--navy); --stripe: rgba(255,255,255,.06); --glow: rgba(165,233,217,.3); }
#ca-at *, #ca-at *::before, #ca-at *::after { box-sizing: border-box; }
#ca-at ol, #ca-at ul, #ca-at li { margin: 0; padding: 0; list-style: none; }
#ca-at li::before, #ca-at li::marker { content: none; }
#ca-at p { margin: 0; }
#ca-at p, #ca-at li, #ca-at span, #ca-at b, #ca-at strong, #ca-at small, #ca-at summary, #ca-at h4, #ca-at td, #ca-at th, #ca-at div { color: inherit; }
#ca-at h4 { margin: 0; padding: 0; text-transform: none; letter-spacing: 0; }
#ca-at a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
#ca-at a:focus-visible, #ca-at button:focus-visible, #ca-at summary:focus-visible { outline: 3px solid var(--gold) !important; outline-offset: 3px; border-radius: 6px; }
#ca-at summary:focus:not(:focus-visible), #ca-at button:focus:not(:focus-visible), #ca-at a:focus:not(:focus-visible), #ca-at details:focus { outline: none !important; box-shadow: none; }
#ca-at .sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
#ca-at svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* Sort buttons and the "what the steps mean" panel */
#ca-at .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
#ca-at .chips { display: flex; gap: 8px; flex-wrap: wrap; }
#ca-at button.ca-btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: auto; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
#ca-at button.ca-btn[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
#ca-at details.explain { margin: 0 0 12px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--radius) - 4px); padding: 0 14px; }
#ca-at[data-look="b"] details.explain { border-width: 1px 0; border-radius: 0; padding: 0; }
#ca-at .ex { display: grid; gap: 10px; padding: 2px 0 14px; }
@container (min-width: 640px) { #ca-at .ex { grid-template-columns: 1fr 1fr; gap: 12px 24px; } }

#ca-at .states span { display: inline-flex; gap: 6px; align-items: center; }
#ca-at .states i { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--todo); display: inline-block; background: var(--bg); }
#ca-at .states i.done { background: var(--done); border-color: var(--done); }

#ca-at[data-look="b"] .states i { border-radius: 2px; }
#ca-at[data-look="b"] .states i.partial { background: repeating-linear-gradient(135deg, var(--done) 0 3px, var(--todo) 3px 6px); border: 0; }

/* Step header: stays under the site's menu bar while you scroll the list */
#ca-at .cols { position: sticky; top: var(--ca-top); z-index: 5; display: grid; grid-template-columns: 1fr; padding: 8px 31px 8px; margin: 0 -16px 8px; background: var(--bg); border-bottom: 1px solid var(--line-strong); box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
#ca-at[data-look="b"] .cols { margin: 0 -16px 0; padding: 8px 16px; }

#ca-at .trk-h .h { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; line-height: 1.1; color: var(--fg); }
#ca-at .trk-h .h svg.ic { width: 20px; height: 20px; color: var(--accent); }
#ca-at .trk-h .full { display: none; }
@container (min-width: 520px) { #ca-at .trk-h .full { display: inline; } #ca-at .trk-h .abbr { display: none; } #ca-at .trk-h .h { font-size: 12.5px; } }

/* Bill rows */
#ca-at .bills { display: grid; gap: 8px; }
#ca-at[data-look="b"] .bills { gap: 0; }
#ca-at .bill { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
#ca-at[data-look="b"] .bill { border-width: 0 0 1px; padding: 14px 0; }
#ca-at .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 12px; }
#ca-at .bill h4 { font-family: inherit; font-size: 18px; font-weight: 700; line-height: 1.25; color: var(--fg); }
#ca-at .num { font-size: 15px; font-weight: 600; white-space: nowrap; }
#ca-at[data-look="c"] .num a { color: var(--mint); }
#ca-at .now { margin-top: 12px; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; gap: 2px; }
#ca-at .now b { font-weight: 700; font-size: 16px; }
#ca-at .now .d a { font-weight: 600; }
#ca-at .now .pt { color: var(--muted); font-size: 14px; }
#ca-at .now .pt abbr { text-decoration: none; border: 0; }

/* Six-step track with an icon in each dot */
#ca-at .trk-w { position: relative; }
#ca-at .trk { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; }
#ca-at .trk-w::before, #ca-at .trk-w .fill { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 15px; height: 4px; border-radius: 2px; background: var(--todo); }
#ca-at .trk-w .fill { background: var(--done); transform-origin: left center; transform: scaleX(var(--p, 0)); }
#ca-at .st { position: relative; z-index: 1; display: flex; justify-content: center; }
#ca-at .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 3px solid var(--todo); color: var(--todo-icon); display: grid; place-items: center; }
#ca-at[data-look="a"] .dot { background: var(--paper); }
#ca-at[data-look="c"] .dot { background: var(--navy); }
#ca-at .st.done .dot { background: var(--done); border-color: var(--done); color: var(--done-fg); }
#ca-at .st.partial .dot { background: var(--partial-bg); border-color: var(--ring); color: var(--fg); }
#ca-at[data-look="c"] .st.partial .dot { background: #35596f; }
#ca-at .st.cur .dot { box-shadow: 0 0 0 5px var(--glow); }
/* Look B: a segmented bar; the icons live in the step header */
#ca-at[data-look="b"] .trk { gap: 3px; }
#ca-at[data-look="b"] .trk-w::before, #ca-at[data-look="b"] .trk-w .fill { display: none; }
#ca-at[data-look="b"] .st { display: block; }
#ca-at[data-look="b"] .dot { width: auto; height: 14px; border-radius: 0; border: 0; background: var(--todo); box-shadow: none; }
#ca-at[data-look="b"] .st.done .dot { background: var(--done); }
#ca-at[data-look="b"] .st.partial .dot { background: repeating-linear-gradient(135deg, var(--done) 0 4px, var(--todo) 4px 8px); }
#ca-at[data-look="b"] .st.cur .dot { box-shadow: inset 0 -4px 0 var(--cardinal); }
#ca-at[data-look="b"] .dot svg { display: none; }
#ca-at[data-look="b"] .trk-h { gap: 3px; }

/* Step-by-step table */
#ca-at details.more { margin-top: 12px; border-top: 1px solid var(--line); }
#ca-at summary { cursor: pointer; color: var(--fg) !important; font-family: inherit; font-weight: 700; font-size: 15px; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
#ca-at summary::-webkit-details-marker { display: none; }
#ca-at summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; font-size: 15px; line-height: 1; flex: none; }
#ca-at details[open] > summary::before { content: "\2212"; }
#ca-at table { width: 100%; border-collapse: collapse; font-family: inherit; font-size: 15px; line-height: 1.35; margin: 0 0 8px; background: transparent !important; border: 0 !important; }
#ca-at table thead, #ca-at table tbody, #ca-at table tr { background: transparent !important; border: 0 !important; }
#ca-at table tbody tr:nth-child(even) { background: var(--stripe) !important; }
#ca-at table th, #ca-at table td { font-family: inherit !important; text-align: left; vertical-align: top; padding: 9px 10px !important; border: 0 !important; border-bottom: 1px solid var(--line) !important; background: transparent !important; color: var(--fg) !important; font-size: 15px !important; line-height: 1.35 !important; text-transform: none !important; letter-spacing: 0 !important; }
#ca-at table tbody th { font-weight: 700 !important; width: 34%; }
#ca-at table td { font-weight: 400 !important; }
#ca-at table td.no { color: var(--muted) !important; }
#ca-at table thead th { font-size: 12px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: .06em !important; color: var(--muted) !important; border-bottom: 2px solid var(--line-strong) !important; }
@container (max-width: 520px) {
  #ca-at table th, #ca-at table td { padding: 8px 6px !important; font-size: 14px !important; }
  #ca-at table td { white-space: nowrap; }
  #ca-at table tbody th { width: auto; }
}
#ca-at .meta { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* Wide container: one line per bill, columns line up under the step header */
@container (min-width: 800px) {
  #ca-at .cols, #ca-at .row { display: grid; grid-template-columns: 210px minmax(320px, 1fr) 250px; gap: 22px; align-items: center; }
  #ca-at .cols { padding: 10px 31px; }
  #ca-at[data-look="b"] .cols { padding: 10px 16px; }
  #ca-at .cols .c-bill, #ca-at .cols .c-where { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); align-self: end; }
  #ca-at .top { margin: 0; flex-direction: column; align-items: flex-start; }
  #ca-at .now { margin: 0; }
}

#ca-at .foot { margin-top: 14px; font-size: 13px; color: var(--muted); }
#ca-at .foot p { max-width: 80ch; }
#ca-at .err { background: var(--card); border: 2px solid var(--cardinal); border-radius: 10px; padding: 14px; }

/* Motion: each row settles in as it scrolls into view. Skipped for reduced-motion users. */
#ca-at.anim .bill { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1); }
#ca-at.anim .bill.in { opacity: 1; transform: none; }
#ca-at.anim .bill .dot { transform: scale(.5); transition: transform .4s cubic-bezier(.3,1.6,.5,1); transition-delay: calc(var(--s, 0) * 90ms + 120ms); }
#ca-at.anim .bill.in .dot { transform: scale(1); }
#ca-at.anim .bill .fill { transform: scaleX(0); transition: transform 1s cubic-bezier(.2,.7,.2,1) .15s; }
#ca-at.anim .bill.in .fill { transform: scaleX(var(--p, 0)); }
@media (prefers-reduced-motion: reduce) { #ca-at *, #ca-at *::before, #ca-at *::after { transition: none !important; animation: none !important; } }
</style>

<section id="ca-at" data-look="a" aria-label="Appropriations bill tracker">
  <div class="bar">
    <div class="chips" role="group" aria-label="Sort the bills">
      <button type="button" class="ca-btn" data-sort="az" aria-pressed="true">A to Z</button>
      <button type="button" class="ca-btn" data-sort="far" aria-pressed="false">Furthest along</button>
    </div>
  </div>
  <details class="explain">
    <summary>What the six steps mean</summary>
    <ol class="ex" id="ca-ex"></ol>
    <p class="states"><span><i class="done"></i>Done</span><span><i class="partial"></i>One chamber done, the other not yet</span><span><i></i>Not yet</span></p>
  </details>
  <div class="cols" aria-hidden="true"><span class="c-bill">Bill</span><span class="trk-h" id="ca-cols"></span><span class="c-where">Where it stands</span></div>
  <ol class="bills" id="ca-bills" aria-label="The 12 bills" aria-busy="true"><li class="bill">Loading the latest status from Congress.gov.</li></ol>
  <div class="foot"><p id="ca-src"></p></div>
</section>

<script id="ca-at-app">
(function () {
  "use strict";
  var root = document.getElementById("ca-at");
  if (!root) return;
  var DATA_URL = window.CA_AT_DATA_URL || "data/approps.json";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var P = {
    sub: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>',
    committee: '<rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9.5 3h5v3h-5z"/><path d="M8.5 13.5l2.5 2.5 4.5-5"/>',
    house: '<path d="M3 9.5L12 4l9 5.5"/><path d="M3.5 10h17"/><path d="M6.5 12.5v5.5M10.5 12.5v5.5M13.5 12.5v5.5M17.5 12.5v5.5"/><path d="M3 20.5h18"/>',
    senate: '<path d="M12 2.5v3"/><path d="M6 12a6 6 0 0 1 12 0"/><path d="M4.5 12.5h15"/><path d="M7.5 15v3.5M12 15v3.5M16.5 15v3.5"/><path d="M3 20.5h18"/>',
    final: '<path d="M3 5.5c5.5 0 6 6.5 9 6.5M3 18.5c5.5 0 6-6.5 9-6.5h8.5"/><path d="M17.5 9l3 3-3 3"/>',
    law: '<path d="M15 4.5l4.5 4.5L9.5 19H5v-4.5z"/><path d="M12.5 7l4.5 4.5"/><path d="M4 21.5h16"/>'
  };
  var SHORT = { sub: "Subcmte", committee: "Cmte", house: "House", senate: "Senate", final: "Deal", law: "Law" };
  var WHAT = {
    sub: "A small panel of appropriators writes the first draft and votes on it.",
    committee: "The full Appropriations Committee amends the bill and votes to send it to the floor.",
    house: "All 435 House members debate the bill and vote on it.",
    senate: "All 100 senators debate the bill and vote on it.",
    final: "The House and Senate settle their differences and pass the same text.",
    law: "The President signs it, and the agencies it covers are funded for the year."
  };
  function icon(k) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + P[k] + "</svg>"; }
  var still = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) || !("IntersectionObserver" in window);
  var data = null, sortBy = "az", io = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fd(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); if (!m) return ""; var y = +m[1]; return MON[+m[2] - 1] + " " + (+m[3]) + (y !== new Date().getFullYear() ? ", " + y : ""); }
  function ps(p) { p = (p || "").toLowerCase(); return p.indexOf("rep") === 0 ? "R" : p.indexOf("dem") === 0 ? "D" : p.indexOf("ind") === 0 ? "I" : p; }
  function step(b, k) { for (var i = 0; i < b.steps.length; i++) if (b.steps[i].key === k) return b.steps[i]; return {}; }
  function voteUrl(v) {
    if (!v || !v.source) return null;
    var m = /clerk\.house\.gov\/evs\/(\d{4})\/roll0*(\d+)\.xml/.exec(v.source);
    if (m) return "https://clerk.house.gov/Votes/" + m[1] + m[2];
    return /senate\.gov/.test(v.source) ? v.source.replace(/\.xml$/, ".htm") : null;
  }

  // "Where it stands": a short headline, then the vote and date, then the party split, each on its own line.
  function standing(b) {
    var hp = step(b, "house"), sp = step(b, "senate"), fin = step(b, "final"), law = step(b, "law"), cm = step(b, "committee");
    var head, line = "", v = b.lastVote, parties = "";
    if (law.status === "done") head = "Signed into law";
    else if (fin.status === "done") head = "Final version passed";
    else if (hp.status === "done" && sp.status === "done") head = "Passed House and Senate";
    else if (hp.status === "done") head = "Passed the House";
    else if (sp.status === "done") head = "Passed the Senate";
    else if (cm.status && cm.status !== "todo") head = cm.house && cm.senate ? "Approved by both committees" : cm.house ? "Approved by House committee" : "Approved by Senate committee";
    else head = "Not started";
    if (v && !v.error) {
      if (v.tally) {
        line = "Committee vote " + esc(v.tally) + ", " + fd(v.date);
      } else {
        var t = esc(v.chamber) + " vote " + v.yea + "-" + v.nay + ", " + fd(v.date), u = voteUrl(v);
        line = u ? '<a href="' + esc(u) + '">' + t + "</a>" : t;
        parties = (v.parties || []).filter(function (p) { return p.yea || p.nay; }).map(function (p) {
          return '<abbr title="' + esc(p.party) + '">' + ps(p.party) + "</abbr> " + p.yea + "-" + p.nay;
        }).join(", ");
      }
    }
    return '<p class="now"><b>' + head + "</b>" + (line ? '<span class="d">' + line + "</span>" : "") + (parties ? '<span class="pt">' + parties + "</span>" : "") + "</p>";
  }
  function srNote(s) {
    if (s.status === "todo") return "not yet";
    if (s.key === "sub" || s.key === "committee") {
      var out = [];
      if (s.house) out.push("House " + fd(s.house.date) + (s.house.vote ? ", " + s.house.vote : ""));
      if (s.senate) out.push("Senate " + fd(s.senate.date) + (s.senate.vote ? ", " + s.senate.vote : ""));
      return (s.status === "partial" ? "one chamber done, " : "done, ") + out.join("; ") + (s.senate ? "" : "; Senate not yet");
    }
    return "done " + fd(s.date);
  }
  function cell(s, side) {
    if (s.key === "sub" || s.key === "committee") { var x = s[side]; return x ? fd(x.date) + (x.vote ? " (" + esc(x.vote) + ")" : "") : "Not yet"; }
    if (s.key === "house") return side === "house" ? (s.status === "done" ? fd(s.date) + (s.vote && !s.vote.error ? " (" + s.vote.yea + "-" + s.vote.nay + ")" : "") : "Not yet") : "-";
    if (s.key === "senate") return side === "senate" ? (s.status === "done" ? fd(s.date) + (s.vote && !s.vote.error ? " (" + s.vote.yea + "-" + s.vote.nay + ")" : "") : "Not yet") : "-";
    return s.status === "done" ? fd(s.date) : "Not yet";
  }

  function renderHead() {
    document.getElementById("ca-cols").innerHTML = data.steps.map(function (s) {
      return '<span class="h">' + icon(s.key) + '<span class="full">' + esc(s.label).replace("Subcommittee", "Sub&shy;committee") + '</span><span class="abbr">' + SHORT[s.key] + "</span></span>";
    }).join("");
    document.getElementById("ca-ex").innerHTML = data.steps.map(function (s, i) {
      return '<li><span class="badge">' + icon(s.key) + "</span><span><b>" + (i + 1) + ". " + esc(s.label) + "</b>" + WHAT[s.key] + "</span></li>";
    }).join("");
  }

  function renderBills() {
    var bills = data.bills.slice().sort(function (a, b) { return (sortBy === "far" ? b.stage - a.stage : 0) || a.short.localeCompare(b.short); });
    var list = document.getElementById("ca-bills");
    list.innerHTML = bills.map(function (b) {
      var cur = 0;
      b.steps.forEach(function (s, k) { if (s.status !== "todo") cur = k; });
      var trk = b.steps.map(function (s, k) {
        return '<li class="st ' + s.status + (k === cur && s.status !== "todo" ? " cur" : "") + '" style="--s:' + k + '"><span class="dot" aria-hidden="true">' + icon(s.key) + "</span>" +
          '<span class="sr">' + esc(s.label) + ": " + esc(srNote(s)) + "</span></li>";
      }).join("");
      var links = b.bills.map(function (x) { return '<a href="' + esc(x.url) + '">' + esc(x.label) + '<span class="sr"> on Congress.gov</span></a>'; }).join(" ");
      var td = function (v) { return "<td" + (v === "Not yet" || v === "-" ? ' class="no"' : "") + ">" + v + "</td>"; };
      var rows = b.steps.map(function (s) { return '<tr><th scope="row">' + esc(s.label) + "</th>" + td(cell(s, "house")) + td(cell(s, "senate")) + "</tr>"; }).join("");
      var la = b.latestAction ? '<p class="meta">Latest official action, ' + fd(b.latestAction.date) + ": " + esc(b.latestAction.text) + "</p>" : "";
      return '<li class="bill"><div class="row">' +
        '<div class="top"><h4 id="ca-b-' + b.id + '">' + esc(b.short) + '</h4><span class="num">' + links + "</span></div>" +
        '<div class="trk-w"><span class="fill" style="--p:' + (cur / 5).toFixed(3) + '" aria-hidden="true"></span><ol class="trk" aria-label="' + esc(b.short) + " progress, step " + (b.stage || 0) + ' of 6">' + trk + "</ol></div>" +
        standing(b) + "</div>" +
        '<details class="more"><summary>Step by step<span class="sr"> for ' + esc(b.short) + "</span></summary>" +
        '<table><caption class="sr">' + esc(b.name) + ' by step</caption><thead><tr><th scope="col">Step</th><th scope="col">House</th><th scope="col">Senate</th></tr></thead><tbody>' + rows + "</tbody></table>" +
        la + "</details></li>";
    }).join("");
    list.setAttribute("aria-busy", "false");
    watchRows();
  }

  function watchRows() {
    var rows = root.querySelectorAll(".bill");
    if (still) { Array.prototype.forEach.call(rows, function (r) { r.classList.add("in"); }); return; }
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.15 });
    Array.prototype.forEach.call(rows, function (r) { io.observe(r); });
  }

  // Keep the step header just under whatever the site pins to the top of the screen (its menu bar).
  function pinnedTop() {
    var bottom = 0, x = Math.round(window.innerWidth / 2);
    for (var tries = 0; tries < 4; tries++) {
      var found = null, els = document.elementsFromPoint ? document.elementsFromPoint(x, bottom + 2) : [];
      for (var i = 0; i < els.length && !found; i++) {
        var n = els[i];
        while (n && n !== document.body && n !== document.documentElement) {
          if (n === root || root.contains(n)) break;
          var pos = getComputedStyle(n).position;
          if (pos === "fixed" || pos === "sticky") { found = n; break; }
          n = n.parentElement;
        }
      }
      if (!found) break;
      var r = found.getBoundingClientRect();
      if (r.bottom <= bottom + 1 || r.height > window.innerHeight * 0.4) break;
      bottom = r.bottom;
    }
    return Math.max(0, Math.round(bottom));
  }
  var ticking = false;
  function syncTop() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; root.style.setProperty("--ca-top", pinnedTop() + "px"); });
  }

  function renderSrc() {
    var when;
    try { when = new Date(data.lastUpdated).toLocaleString("en-US", { timeZone: "America/New_York", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + " ET"; } catch (e) { when = data.lastUpdated; }
    document.getElementById("ca-src").innerHTML = "Updates automatically. Last checked " + esc(when) +
      '. Sources: <a href="https://www.congress.gov/">Congress.gov</a> bill actions; roll calls from the House Clerk and the U.S. Senate; markup dates from the <a href="https://www.congress.gov/crs-appropriations-status-table">CRS status table</a>.';
  }

  Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function (btn) {
    btn.addEventListener("click", function () {
      sortBy = btn.getAttribute("data-sort");
      Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function (x) { x.setAttribute("aria-pressed", x === btn ? "true" : "false"); });
      if (data) renderBills();
    });
  });
  window.CA_AT_setLook = function (l) { root.setAttribute("data-look", l); };
  if (!still) root.classList.add("anim");
  window.addEventListener("scroll", syncTop, { passive: true });
  window.addEventListener("resize", syncTop);
  syncTop();
  fetch(DATA_URL, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; renderHead(); renderBills(); renderSrc(); syncTop(); })
    .catch(function (err) {
      if (window.console) console.error("ca-at tracker:", err);
      document.getElementById("ca-bills").innerHTML = '<li class="err">The latest status could not load. See the <a href="https://www.congress.gov/crs-appropriations-status-table">CRS Appropriations Status Table</a> on Congress.gov.</li>';
      document.getElementById("ca-bills").setAttribute("aria-busy", "false");
    });
})();
</script>
