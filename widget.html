<!-- BEGIN WORDPRESS BLOCK: Appropriations Tracker (replaces the chart image only). Paste into one Raw HTML element. -->
<style id="ca-at-style">
#ca-at {
  --navy: #1d3c5c; --navy-deep: #13293f; --cardinal: #b93c35; --gold: #C0780A; --ivory: #F8F1E9; --paper: #FFFCF7;
  --mint: #A5E9D9; --gray: #5E6670;
  --bg: var(--ivory); --fg: var(--navy); --muted: var(--gray); --card: var(--paper); --line: rgba(29,60,92,.16);
  --accent: var(--gold); --done: var(--navy); --done-fg: #fff; --todo: #C9CED4; --ring: var(--gold);
  --chip-on: var(--navy); --chip-on-fg: #fff; --radius: 14px; --stripe: rgba(29,60,92,.05); --line-strong: rgba(29,60,92,.35);
  container-type: inline-size;
  background: var(--bg); color: var(--fg); font-family: inherit; font-size: 16px; line-height: 1.45;
  border-radius: var(--radius); padding: 20px 16px 16px; margin: 8px 0 28px; text-align: left;
}
#ca-at[data-look="b"] { --bg: #fff; --card: #fff; --accent: var(--cardinal); --todo: #E3E7EB; --ring: var(--navy); --radius: 0px; padding: 16px 16px 8px; border-top: 3px solid var(--navy); }
#ca-at[data-look="c"] { --stripe: rgba(255,255,255,.06); --line-strong: rgba(248,241,233,.4); --bg: var(--navy); --fg: var(--ivory); --muted: rgba(248,241,233,.82); --card: rgba(255,255,255,.07); --line: rgba(248,241,233,.16);
  --accent: #EA9E83; --done: var(--mint); --done-fg: var(--navy-deep); --todo: rgba(248,241,233,.25); --ring: var(--mint); --chip-on: var(--ivory); --chip-on-fg: var(--navy); }
#ca-at *, #ca-at *::before, #ca-at *::after { box-sizing: border-box; }
#ca-at ol, #ca-at ul, #ca-at li { margin: 0; padding: 0; list-style: none; }
#ca-at li::before, #ca-at li::marker { content: none; }
#ca-at p { margin: 0; }
#ca-at p, #ca-at li, #ca-at span, #ca-at b, #ca-at strong, #ca-at small, #ca-at summary, #ca-at h4, #ca-at td, #ca-at th, #ca-at div { color: inherit; }
#ca-at h3, #ca-at h4 { margin: 0; padding: 0; text-transform: none; letter-spacing: 0; }
#ca-at a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
#ca-at a:focus-visible, #ca-at button:focus-visible, #ca-at summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
#ca-at .sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }


/* Tools */
#ca-at .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
#ca-at .chips { display: flex; gap: 8px; flex-wrap: wrap; }
#ca-at button.ca-btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; width: auto; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
#ca-at button.ca-btn[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
#ca-at .ca-leg { font-family: inherit; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
#ca-at .ca-leg span { display: inline-flex; gap: 6px; align-items: center; }
#ca-at .ca-leg i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--todo); display: inline-block; }
#ca-at .ca-leg i.done { background: var(--done); border-color: var(--done); }
#ca-at .ca-leg i.partial { background: linear-gradient(90deg, var(--done) 50%, transparent 50%); border-color: var(--ring); }
#ca-at[data-look="b"] .ca-leg i { border-radius: 2px; }

/* Bill rows */
#ca-at .cols { display: none; }
#ca-at .bills { display: grid; gap: 8px; }
#ca-at[data-look="b"] .bills { gap: 0; border-top: 1px solid var(--line); }
#ca-at .bill { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
#ca-at[data-look="b"] .bill { border-width: 0 0 1px; padding: 14px 0; }
#ca-at .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 10px; }
#ca-at .bill h4 { font-family: inherit; font-size: 18px; font-weight: 700; line-height: 1.25; color: var(--fg); }
#ca-at .num { font-size: 15px; font-weight: 600; white-space: nowrap; }
#ca-at[data-look="c"] .num a { color: var(--mint); }
#ca-at .now { margin-top: 10px; font-size: 15px; }
#ca-at .vote { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
#ca-at .vote .pt { white-space: nowrap; }

/* Six-step track */
#ca-at .trk-w { position: relative; }
#ca-at .trk { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; }
#ca-at .trk-w::before, #ca-at .trk-w .fill { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 12px; height: 4px; border-radius: 2px; background: var(--todo); }
#ca-at .trk-w .fill { background: var(--done); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform 1.1s cubic-bezier(.2,.7,.2,1); }
#ca-at .st { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
#ca-at .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); border: 3px solid var(--todo); display: grid; place-items: center; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
#ca-at .st.done .dot { background: var(--done); border-color: var(--done); }
#ca-at .st.partial .dot { background: linear-gradient(90deg, var(--done) 50%, var(--bg) 50%); border-color: var(--ring); }
#ca-at .st.cur .dot { box-shadow: 0 0 0 4px rgba(192,120,10,.3); }
#ca-at[data-look="c"] .st.cur .dot { box-shadow: 0 0 0 4px rgba(165,233,217,.3); }
#ca-at .dot svg { width: 14px; height: 14px; stroke: var(--done-fg); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
#ca-at .st.partial svg, #ca-at .st.todo svg { display: none; }
#ca-at .lb { font-size: 12px; line-height: 1.15; text-align: center; color: var(--muted); font-weight: 600; }
#ca-at .lb .full { display: none; }
@container (min-width: 520px) { #ca-at .lb .full { display: inline; } #ca-at .lb .abbr { display: none; } }
#ca-at[data-look="b"] .trk { gap: 3px; }
#ca-at[data-look="b"] .trk-w::before, #ca-at[data-look="b"] .trk-w .fill { display: none; }
#ca-at[data-look="b"] .st { align-items: stretch; }
#ca-at[data-look="b"] .dot { width: auto; height: 14px; border-radius: 0; border: 0; background: var(--todo); box-shadow: none; }
#ca-at[data-look="b"] .st.done .dot { background: var(--done); }
#ca-at[data-look="b"] .st.partial .dot { background: repeating-linear-gradient(135deg, var(--done) 0 4px, var(--todo) 4px 8px); }
#ca-at[data-look="b"] .st.cur .dot { box-shadow: inset 0 -4px 0 var(--cardinal); }
#ca-at[data-look="b"] .dot svg { display: none; }
#ca-at[data-look="b"] .lb { text-align: left; }

/* Step-by-step details */
#ca-at details { margin-top: 10px; border-top: 1px solid var(--line); }
#ca-at summary { cursor: pointer; color: var(--fg) !important; font-family: inherit; font-weight: 700; font-size: 15px; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
#ca-at summary::-webkit-details-marker { display: none; }
#ca-at summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid currentColor; font-size: 15px; line-height: 1; }
#ca-at details[open] summary::before { content: "\2212"; }
#ca-at table { width: 100%; border-collapse: collapse; font-family: inherit; font-size: 15px; line-height: 1.35; margin: 0 0 8px; background: transparent !important; border: 0 !important; }
#ca-at table thead, #ca-at table tbody, #ca-at table tr { background: transparent !important; border: 0 !important; }
#ca-at table tbody tr:nth-child(even) { background: var(--stripe) !important; }
#ca-at table th, #ca-at table td { font-family: inherit !important; text-align: left; vertical-align: top; padding: 9px 10px !important; border: 0 !important; border-bottom: 1px solid var(--line) !important; background: transparent !important; color: var(--fg) !important; font-size: 15px !important; line-height: 1.35 !important; text-transform: none !important; letter-spacing: 0 !important; }
#ca-at table tbody th { font-weight: 700 !important; width: 34%; }
#ca-at table td { font-weight: 400 !important; }
@container (max-width: 520px) {
  #ca-at table th, #ca-at table td { padding: 8px 6px !important; font-size: 14px !important; }
  #ca-at table td { white-space: nowrap; }
  #ca-at table tbody th { width: auto; }
}
#ca-at table td.no { color: var(--muted) !important; }
#ca-at table thead th { font-size: 12px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: .06em !important; color: var(--muted) !important; border-bottom: 2px solid var(--line-strong) !important; }
#ca-at .meta { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* Wide container: one line per bill, columns line up */
@container (min-width: 780px) {
  #ca-at .cols, #ca-at .row { display: grid; grid-template-columns: 190px minmax(300px, 1fr) 230px; gap: 20px; align-items: center; }
  #ca-at .cols { padding: 0 15px 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  #ca-at[data-look="b"] .cols { padding: 0 0 6px; }
  #ca-at .cols .trk-h { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; gap: 2px; line-height: 1.15; }
  #ca-at[data-look="b"] .cols .trk-h { text-align: left; gap: 3px; }
  #ca-at .top { margin: 0; flex-direction: column; align-items: flex-start; }
  #ca-at .bill .lb { display: none; }
  #ca-at .now { margin: 0; font-size: 14px; }
  #ca-at .ca-leg { display: none; }
}

#ca-at .foot { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
#ca-at .foot p { max-width: 70ch; }
#ca-at .err { background: var(--card); border: 2px solid var(--cardinal); border-radius: 10px; padding: 14px; }

/* Motion. Off with "No animations" and for reduced-motion users. */
#ca-at.anim .bill { opacity: 0; transform: translateY(8px); }
#ca-at.anim.in .bill { opacity: 1; transform: none; transition: opacity .45s ease, transform .45s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 40ms); }
#ca-at.anim .dot { transform: scale(.4); }
#ca-at.anim.in .dot { transform: scale(1); transition-delay: calc(var(--i, 0) * 40ms + var(--s, 0) * 100ms + 150ms); }
#ca-at.calm *, #ca-at.calm *::before, #ca-at.calm *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { #ca-at *, #ca-at *::before, #ca-at *::after { transition: none !important; animation: none !important; } }
</style>

<section id="ca-at" data-look="a" aria-label="Appropriations bill tracker">
  <div class="bar">
    <div class="chips" role="group" aria-label="Sort the bills">
      <button type="button" class="ca-btn" data-sort="az" aria-pressed="true">A to Z</button>
      <button type="button" class="ca-btn" data-sort="far" aria-pressed="false">Furthest along</button>
    </div>
    <p class="ca-leg" aria-hidden="true"><span><i class="done"></i>Done</span><span><i class="partial"></i>One chamber</span><span><i></i>Not yet</span></p>
  </div>
  <div class="cols" aria-hidden="true"><span>Bill</span><span class="trk-h" id="ca-cols"></span><span>Where it stands</span></div>
  <ol class="bills" id="ca-bills" aria-label="The 12 bills" aria-busy="true"><li class="bill">Loading the latest status from Congress.gov.</li></ol>
  <div class="foot">
    <p id="ca-src"></p>
    <button type="button" class="ca-btn" id="ca-calm" aria-pressed="false">No animations</button>
  </div>
</section>

<script id="ca-at-app">
(function () {
  "use strict";
  var root = document.getElementById("ca-at");
  if (!root) return;
  var DATA_URL = window.CA_AT_DATA_URL || "data/approps.json";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var ABBR = { sub: "Sub", committee: "Cmte", house: "House", senate: "Senate", final: "Deal", law: "Law" };
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  var calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  try { if (localStorage.getItem("ca-at-calm") === "1") calm = true; } catch (e) {}
  var data = null, sortBy = "az";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fd(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); if (!m) return ""; var y = +m[1]; return MON[+m[2] - 1] + " " + (+m[3]) + (y !== new Date().getFullYear() ? ", " + y : ""); }
  function ps(p) { p = (p || "").toLowerCase(); return p.indexOf("rep") === 0 ? "R" : p.indexOf("dem") === 0 ? "D" : p.indexOf("ind") === 0 ? "I" : p; }
  function step(b, k) { for (var i = 0; i < b.steps.length; i++) if (b.steps[i].key === k) return b.steps[i]; return {}; }
  function voteUrl(v) {
    if (!v || !v.source) return null;
    var m = /clerk\.house\.gov\/evs\/(\d{4})\/roll0*(\d+)\.xml/.exec(v.source);
    if (m) return "https://clerk.house.gov/Votes/" + m[1] + m[2];
    return /senate\.gov/.test(v.source) ? v.source.replace(/\.xml$/, ".htm") : null;
  }
  function voteLine(v) {
    if (!v || v.error) return "";
    if (v.tally) return "House committee " + esc(v.tally) + ", " + fd(v.date);
    var pts = (v.parties || []).filter(function (p) { return p.yea || p.nay; }).map(function (p) {
      return '<span class="pt"><abbr title="' + esc(p.party) + '">' + ps(p.party) + "</abbr> " + p.yea + "-" + p.nay + "</span>";
    }).join(", ");
    var q = (v.question || "").replace(/^On /, "").toLowerCase();
    var t = esc(v.chamber) + " " + esc(q) + " " + v.yea + "-" + v.nay + ", " + fd(v.date);
    var u = voteUrl(v);
    return (u ? '<a href="' + esc(u) + '">' + t + "</a>" : t) + (pts ? " (" + pts + ")" : "");
  }
  function sentence(b) {
    var hp = step(b, "house"), sp = step(b, "senate"), fin = step(b, "final"), law = step(b, "law"), cm = step(b, "committee");
    if (law.status === "done") return "<b>Signed into law</b> " + fd(law.date) + ".";
    if (fin.status === "done") return "<b>Final version agreed</b> " + fd(fin.date) + ". Waiting on the President.";
    if (hp.status === "done" && sp.status === "done") return "<b>Passed both chambers.</b> Differences not yet resolved.";
    if (hp.status === "done") return "<b>Passed the House</b> " + fd(hp.date) + ". Waiting on the Senate.";
    if (sp.status === "done") return "<b>Passed the Senate</b> " + fd(sp.date) + ". Waiting on the House.";
    if (cm.status && cm.status !== "todo") {
      var who = cm.house && cm.senate ? "House and Senate committees" : cm.house ? "House committee" : "Senate committee";
      return "<b>Approved by the " + who + "</b> " + fd((cm.house || cm.senate).date) + ". Waiting for a floor vote.";
    }
    return "<b>Not started.</b>";
  }
  function srNote(s) {
    if (s.status === "todo") return "not yet";
    if (s.key === "sub" || s.key === "committee") {
      var out = [];
      if (s.house) out.push("House " + fd(s.house.date) + (s.house.vote ? ", " + s.house.vote : ""));
      if (s.senate) out.push("Senate " + fd(s.senate.date) + (s.senate.vote ? ", " + s.senate.vote : ""));
      return (s.status === "partial" ? "one chamber done, " : "done, ") + out.join("; ") + (s.senate ? "" : "; Senate not yet");
    }
    return "done " + fd(s.date);
  }
  function cell(s, side) {
    if (s.key === "sub" || s.key === "committee") { var x = s[side]; return x ? fd(x.date) + (x.vote ? " (" + esc(x.vote) + ")" : "") : "Not yet"; }
    if (s.key === "house") return side === "house" ? (s.status === "done" ? fd(s.date) + (s.vote && !s.vote.error ? " (" + s.vote.yea + "-" + s.vote.nay + ")" : "") : "Not yet") : "-";
    if (s.key === "senate") return side === "senate" ? (s.status === "done" ? fd(s.date) + (s.vote && !s.vote.error ? " (" + s.vote.yea + "-" + s.vote.nay + ")" : "") : "Not yet") : "-";
    return s.status === "done" ? fd(s.date) : "Not yet";
  }

  function renderCols() {
    document.getElementById("ca-cols").innerHTML = data.steps.map(function (s) { return "<span>" + esc(s.label).replace("Subcommittee", "Sub&shy;committee") + "</span>"; }).join("");
  }

  function renderBills() {
    var bills = data.bills.slice().sort(function (a, b) { return (sortBy === "far" ? b.stage - a.stage : 0) || a.short.localeCompare(b.short); });
    var list = document.getElementById("ca-bills");
    list.innerHTML = bills.map(function (b, i) {
      var cur = 0;
      b.steps.forEach(function (s, k) { if (s.status !== "todo") cur = k; });
      var trk = b.steps.map(function (s, k) {
        return '<li class="st ' + s.status + (k === cur && s.status !== "todo" ? " cur" : "") + '" style="--s:' + k + '"><span class="dot" aria-hidden="true">' + CHECK + "</span>" +
          '<span class="lb" aria-hidden="true"><span class="full">' + esc(s.label) + '</span><span class="abbr">' + ABBR[s.key] + "</span></span>" +
          '<span class="sr">' + esc(s.label) + ": " + esc(srNote(s)) + "</span></li>";
      }).join("");
      var links = b.bills.map(function (x) { return '<a href="' + esc(x.url) + '">' + esc(x.label) + '<span class="sr"> on Congress.gov</span></a>'; }).join(" ");
      var vl = voteLine(b.lastVote);
      var td = function (v) { return '<td' + (v === "Not yet" || v === "-" ? ' class="no"' : "") + ">" + v + "</td>"; };
      var rows = b.steps.map(function (s) { return '<tr><th scope="row">' + esc(s.label) + "</th>" + td(cell(s, "house")) + td(cell(s, "senate")) + "</tr>"; }).join("");
      var la = b.latestAction ? '<p class="meta">Latest official action, ' + fd(b.latestAction.date) + ": " + esc(b.latestAction.text) + "</p>" : "";
      return '<li class="bill" style="--i:' + i + '"><div class="row">' +
        '<div class="top"><h4 id="ca-b-' + b.id + '">' + esc(b.short) + '</h4><span class="num">' + links + "</span></div>" +
        '<div class="trk-w"><span class="fill" style="--p:' + (cur / 5).toFixed(3) + '" aria-hidden="true"></span><ol class="trk" aria-label="' + esc(b.short) + ' progress, step ' + (b.stage || 0) + ' of 6">' + trk + "</ol></div>" +
        '<p class="now">' + sentence(b) + (vl ? '<span class="vote">Last vote: ' + vl + "</span>" : "") + "</p></div>" +
        '<details><summary>Step by step<span class="sr"> for ' + esc(b.short) + "</span></summary>" +
        '<table><caption class="sr">' + esc(b.name) + ' by step</caption><thead><tr><th scope="col">Step</th><th scope="col">House</th><th scope="col">Senate</th></tr></thead><tbody>' + rows + "</tbody></table>" +
        la + "</details></li>";
    }).join("");
    list.setAttribute("aria-busy", "false");
  }

  function renderSrc() {
    var when;
    try { when = new Date(data.lastUpdated).toLocaleString("en-US", { timeZone: "America/New_York", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) + " ET"; } catch (e) { when = data.lastUpdated; }
    document.getElementById("ca-src").innerHTML = "Updates automatically. Last checked " + esc(when) +
      '. Sources: <a href="https://www.congress.gov/">Congress.gov</a> bill actions; roll calls from the House Clerk and the U.S. Senate; markup dates from the <a href="https://www.congress.gov/crs-appropriations-status-table">CRS status table</a>.';
  }

  function render(animate) {
    renderCols(); renderBills(); renderSrc();
    if (animate && !calm) {
      root.classList.remove("in");
      var fills = root.querySelectorAll(".trk-w .fill");
      Array.prototype.forEach.call(fills, function (f) { f.setAttribute("data-p", f.style.getPropertyValue("--p")); f.style.setProperty("--p", "0"); });
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        root.classList.add("in");
        setTimeout(function () { Array.prototype.forEach.call(fills, function (f) { f.style.setProperty("--p", f.getAttribute("data-p")); }); }, 200);
      }); });
    } else { root.classList.add("in"); }
  }
  function setCalm(on) {
    calm = on;
    root.classList.toggle("calm", on);
    root.classList.toggle("anim", !on);
    document.getElementById("ca-calm").setAttribute("aria-pressed", on ? "true" : "false");
    try { localStorage.setItem("ca-at-calm", on ? "1" : "0"); } catch (e) {}
  }

  document.getElementById("ca-calm").addEventListener("click", function () { setCalm(!calm); });
  Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function (btn) {
    btn.addEventListener("click", function () {
      sortBy = btn.getAttribute("data-sort");
      Array.prototype.forEach.call(root.querySelectorAll("[data-sort]"), function (x) { x.setAttribute("aria-pressed", x === btn ? "true" : "false"); });
      if (data) render(true);
    });
  });
  window.CA_AT_setLook = function (l) { root.setAttribute("data-look", l); };
  setCalm(calm);
  fetch(DATA_URL, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { data = d; render(true); })
    .catch(function () {
      document.getElementById("ca-bills").innerHTML = '<li class="err">The latest status could not load. See the <a href="https://www.congress.gov/crs-appropriations-status-table">CRS Appropriations Status Table</a> on Congress.gov.</li>';
      document.getElementById("ca-bills").setAttribute("aria-busy", "false");
    });
})();
</script>
